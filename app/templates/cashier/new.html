{% extends 'base.html' %}

{% block title %}Abrir Sesión de Caja{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Abrir Sesión de Caja</h5>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('cashier.new_session') }}">
                        <div class="form-group">
                            <label for="initial_cash">Monto Inicial de Caja ($):</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="initial_cash" name="initial_cash" required>
                            <small class="form-text text-muted">Ingrese el monto de dinero con el que inicia la caja.</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="notes">Notas:</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Observaciones o comentarios sobre la apertura de caja..."></textarea>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Una vez abierta la sesión de caja, podrá comenzar a realizar ventas en el punto de venta.
                        </div>
                        
                        <div class="form-group text-center">
                            <a href="{{ url_for('cashier.index') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-door-open"></i> Abrir Sesión
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
